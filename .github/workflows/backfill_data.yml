name: Monthly Backfill Collection (Standard Plan)

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: '取得したい年月 (YYYYMM) 例: 202512'
        required: true
      dataset_choice:
        description: '対象データ (all または特定のフォルダ名)'
        required: true
        default: 'all'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 360 # 最大6時間（大量データ用）

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install -r requirements.txt

      - name: Run Backfill Script
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
          DATASET_CHOICE: ${{ github.event.inputs.dataset_choice }}
        run: python src/backfill.py
