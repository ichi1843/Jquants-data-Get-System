name: Monthly Backfill Collection

on:
  workflow_dispatch:
    inputs:
      target_month:
        description: '取得したい年月 (YYYYMM) 例: 202511'
        required: true
        default: '202511'

jobs:
  backfill:
    runs-on: ubuntu-latest
    timeout-minutes: 60 # 1ヶ月分なので少し長めに設定

    steps:
      - name: Checkout code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: pip install requests pandas pyarrow boto3

      - name: Run Backfill Script
        env:
          JQUANTS_API_KEY: ${{ secrets.JQUANTS_API_KEY }}
          R2_ACCOUNT_ID: ${{ secrets.R2_ACCOUNT_ID }}
          R2_ACCESS_KEY_ID: ${{ secrets.R2_ACCESS_KEY_ID }}
          R2_SECRET_ACCESS_KEY: ${{ secrets.R2_SECRET_ACCESS_KEY }}
          R2_BUCKET_NAME: ${{ secrets.R2_BUCKET_NAME }}
          TARGET_MONTH: ${{ github.event.inputs.target_month }}
        run: python src/backfill.py
